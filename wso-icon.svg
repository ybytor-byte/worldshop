<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)" stroke="#00d4ff" stroke-width="3"/>
  <!-- Inner glow circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
  <!-- WSO Text -->
  <text x="100" y="128" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-2">WSO</text>
  <!-- Small accent dot -->
  <circle cx="145" cy="70" r="4" fill="#00d4ff" opacity="0.8"/>
</svg>