<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WowS World Shop Mobile — Visual Search Camera</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Style Sheet -->
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <!-- Background Space theme -->
    <div class="stars-bg"></div>
    
    <!-- Phone Mockup Frame -->
    <div class="phone-container">
        <div class="phone-screen">
            <!-- Notch/Dynamic Island mockup -->
            <div class="phone-notch"></div>
            
            <!-- App Content Area -->
            <div class="mobile-app">
                
                <!-- View 1: Camera Visual Search Screen -->
                <div class="app-screen active" id="screen-camera">
                    
                    <!-- Camera Viewfinder -->
                    <div class="viewfinder" id="camera-view">
                        <!-- Simulated Camera Background image containing visual items (headphones, bags) -->
                        <div class="viewfinder-bg"></div>
                        <div class="scanlines"></div>
                        <div class="camera-grid"></div>
                        <div class="camera-focus-reticle"></div>
                        
                        <!-- UI Overlay on Camera -->
                        <div class="camera-top-bar">
                            <button class="cam-icon-btn"><i class="fa-solid fa-bolt"></i></button>
                            <span class="cam-mode-label">WowS VISUAL DETECT</span>
                            <button class="cam-icon-btn"><i class="fa-solid fa-gear"></i></button>
                        </div>
                        
                        <!-- Detectable interactive overlays -->
                        <div class="detect-target target-headphones" data-product="sony-headphones" title="Sony WH-1000XM5">
                            <span class="target-tag"><i class="fa-solid fa-tag"></i> Наушники</span>
                            <div class="target-box"></div>
                        </div>

                        <div class="detect-target target-bag" data-product="chanel-bag" title="Chanel Classic Bag">
                            <span class="target-tag"><i class="fa-solid fa-tag"></i> Chanel Bag</span>
                            <div class="target-box"></div>
                        </div>
                        
                        <!-- Shutter flash animation layer -->
                        <div class="shutter-flash" id="flash-effect"></div>
                        
                        <!-- Muted notification toast -->
                        <div class="camera-hint">
                            <i class="fa-solid fa-hand-pointer"></i> Нажмите на товар для мгновенного поиска
                        </div>
                    </div>

                    <!-- Bottom Controls & Search Input Bar -->
                    <div class="camera-controls-panel glass-card">
                        
                        <!-- Dynamic Input Bar -->
                        <div class="search-bar-row">
                            <i class="fa-solid fa-magnifying-glass search-bar-icon"></i>
                            <input type="text" id="mob-search-input" placeholder="Введите название товара или артикул..." autocomplete="off">
                            <button class="search-bar-go" id="mob-btn-text-search"><i class="fa-solid fa-arrow-right"></i></button>
                        </div>

                        <!-- Physical Shutter button and shortcuts -->
                        <div class="shutter-row">
                            <button class="side-btn" id="btn-gallery-simulate"><i class="fa-solid fa-images"></i></button>
                            <button class="shutter-button" id="btn-shutter" title="Сделать фото"></button>
                            <button class="side-btn" id="btn-globe-switch"><i class="fa-solid fa-earth-americas"></i></button>
                        </div>
                    </div>

                    <!-- Bottom Slider Modal (detected details) -->
                    <div class="bottom-sheet" id="product-sheet">
                        <div class="sheet-drag-handle"></div>
                        <div class="sheet-content">
                            <div class="detected-badge"><i class="fa-solid fa-circle-check"></i> Товар успешно распознан</div>
                            
                            <div class="sheet-product-info">
                                <img src="" alt="Product" id="sheet-prod-img">
                                <div class="sheet-prod-details">
                                    <h3 id="sheet-prod-title">Название товара</h3>
                                    <p class="sheet-prod-category" id="sheet-prod-category">Категория</p>
                                </div>
                            </div>

                            <div class="sheet-price-row">
                                <div class="price-origin">
                                    <span class="price-lbl">Лучшая цена от:</span>
                                    <strong id="sheet-price-val">$0.00</strong>
                                </div>
                                <span class="country-badge" id="sheet-country-badge">USA</span>
                            </div>

                            <div class="form-group-mobile">
                                <label for="sheet-desc-input">Добавить примечание / описание к поиску:</label>
                                <textarea id="sheet-desc-input" rows="2" placeholder="Например: размер M, черный цвет..."></textarea>
                            </div>

                            <div class="sheet-actions">
                                <button class="btn-secondary-mob" id="btn-save-fav"><i class="fa-regular fa-bookmark"></i> Сохранить</button>
                                <button class="btn-primary-mob" id="btn-go-to-globe">
                                    Показать на Глобусе <i class="fa-solid fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Script Entry Point -->
    <script src="mobile.js"></script>
</body>
</html>
