<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #ffffff;
            --card: #f8fafc;
            --border: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
            --accent: #8b5cf6;
            --accent-cyan: #06b6d4;
        }

        body {
            width: 280px;
            margin: 0;
            padding: 16px;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .logo-icon {
            width: 20px;
            height: 20px;
            stroke: var(--accent-cyan);
            stroke-width: 2.5;
            fill: none;
        }

        .logo-text {
            font-weight: 800;
            letter-spacing: 0.5px;
            font-size: 15px;
        }

        .logo-accent {
            color: var(--accent-cyan);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .switch-label {
            font-weight: 600;
        }

        .switch-desc {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
            line-height: 1.3;
        }

        /* Toggle Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.15);
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-cyan);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        .footer {
            text-align: center;
            font-size: 10px;
            color: var(--muted);
        }

        .footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <svg class="logo-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M2 12h20"></path>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <div class="logo-text">WowS<span class="logo-accent"> WORLD SHOP</span></div>
    </div>

    <div class="card">
        <div class="switch-row">
            <span class="switch-label">Поиск по картинкам</span>
            <label class="switch">
                <input type="checkbox" id="extension-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="switch-desc">
            Включает кнопку быстрого поиска при наведении мыши на любое изображение (например, в Pinterest).
        </div>
    </div>

    <div class="footer">
        WowS World Shop Platform &copy; 2026<br>
        <a href="../web/index.html" target="_blank">Перейти к 3D Глобусу</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
